name: Browser visual validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static dashboard
        run: |
          mkdir -p test-results/visual
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nexus-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexus-http.log
          exit 1
      - name: Run browser visual checks
        run: npx playwright test --config=tests/visual/playwright.config.js
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-aquarium-visual-captures
          path: |
            test-results/visual/*.png
            test-results/playwright/
          if-no-files-found: warn
