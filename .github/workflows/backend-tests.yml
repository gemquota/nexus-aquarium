name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark simulation scaling
        run: python benchmarks/benchmark_engine.py --steps 60 --warmup 10
      - name: Check dashboard JavaScript syntax
        run: |
          node --version
          node --check app.js
