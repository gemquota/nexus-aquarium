name: Sprite asset checks
on:
  push:
    branches: [main, feat/sideview-sprite-renderer]
  pull_request:
  workflow_dispatch:
jobs:
  validate-sprite-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assets/sprites/sprite-runtime.js
          node --check assets/sprites/creature-animation.js
          node --check assets/biome-renderer.js
          node tests/sprite-view.test.js
          node tests/creature-animation.test.js
      - name: Check Python importer syntax
        run: python -m py_compile tools/import_sprite_packs.py
      - name: Validate sprite manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("assets/sprites/sources.json").read_text())
          runtime = json.loads(Path("assets/sprites/runtime-manifest.json").read_text())
          assert sources["world_projection"] == "side_view"
          assert runtime["projection"] == "side_view"
          assert isinstance(sources["packs"], list)
          assert isinstance(runtime["assets"], list)
          generated = [a for a in runtime["assets"] if a.get("source_pack") == "generated-turnarounds"]
          assert len(generated) == 80, f"expected 80 generated views, got {len(generated)}"
          assert len({a["species"] for a in generated}) == 16
          assert {a["view"] for a in generated} == {"front", "front_three_quarter", "side", "rear_three_quarter", "rear"}
          assert all(p.get("projection") == "side_view" for p in sources["packs"])
          print(f"Validated {len(sources['packs'])} side-view source packs and {len(runtime['assets'])} runtime assets")
          PY
