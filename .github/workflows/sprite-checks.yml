name: Sprite asset checks
on:
  push:
    branches: [main, feat/sideview-sprite-renderer, feat/species-articulated-animation]
  pull_request:
  workflow_dispatch:
jobs:
  validate-sprite-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assets/sprites/sprite-runtime.js
          node --check assets/sprites/creature-animation.js
          node --check assets/biome-renderer.js
          node tests/sprite-view.test.js
          node tests/creature-animation.test.js
      - name: Check Python importer syntax
        run: python -m py_compile tools/import_sprite_packs.py
      - name: Validate sprite manifests
        run: |
          python - <<'PY'
          import json
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sources = json.loads(Path("assets/sprites/sources.json").read_text())
          runtime = json.loads(Path("assets/sprites/runtime-manifest.json").read_text())
          assert sources["world_projection"] == "side_view"
          assert runtime["projection"] == "side_view"
          assert isinstance(sources["packs"], list)
          assert isinstance(runtime["assets"], list)
          generated = [a for a in runtime["assets"] if a.get("source_pack") == "generated-turnarounds"]
          species = {a["species"] for a in generated}
          views = {"front", "front_three_quarter", "side", "rear_three_quarter", "rear"}
          assert len(generated) == 80, f"expected 80 generated views, got {len(generated)}"
          assert len(species) == 16, f"expected 16 species, got {len(species)}"
          assert {a["view"] for a in generated} == views
          keys = {(a["species"], a["view"]) for a in generated}
          assert len(keys) == 80, "duplicate species/view keys found"
          assert keys == {(name, view) for name in species for view in views}, "species/view matrix is incomplete"
          for asset in generated:
              path = Path(asset["src"].lstrip("/"))
              assert path.is_file(), f"missing generated sprite: {path}"
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"invalid PNG signature: {path}"
              width, height = struct.unpack(">II", data[16:24])
              assert width > 0 and height > 0, f"invalid dimensions: {path}"
              assert data[25] in (4, 6), f"generated sprite must include alpha: {path}"
          # Every active runtime asset must exist and be parseable. SVGs are first-class
          # runtime assets alongside transparent PNG creature poses.
          legacy_packs = {"kenney-fish", "inmenus-bird-cc0"}
          assert not any(a.get("source_pack") in legacy_packs for a in runtime["assets"]), "legacy-style assets must not remain active in the runtime manifest"
          assert not any(a.get("kind") == "creature" and a.get("species") == "generic" for a in runtime["assets"]), "generic legacy fish must not be active runtime fallbacks"
          for asset in runtime["assets"]:
              path = Path(asset["src"].lstrip("/"))
              assert path.is_file(), f"missing runtime sprite: {path}"
              if path.suffix.lower() == ".svg":
                  root = ET.parse(path).getroot()
                  assert root.tag.endswith("svg"), f"invalid SVG root: {path}"
              elif path.suffix.lower() == ".png":
                  data = path.read_bytes()
                  assert data[:8] == b"\\x89PNG\\r\\n\\x1a\\n", f"invalid PNG signature: {path}"
              else:
                  raise AssertionError(f"unsupported runtime sprite format: {path}")
          assert all(p.get("projection") == "side_view" for p in sources["packs"])
          print(f"Validated {len(sources['packs'])} side-view source packs, {len(generated)} transparent creature poses and {len(runtime['assets'])} active runtime sprites")
          PY
